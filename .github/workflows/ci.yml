name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest test_api.py -v
        
      - name: Compile C++ application
        run: g++ -std=c++17 -Wall -Wextra -pedantic main.cpp LogEntry.cpp LogParser.cpp LogFilter.cpp LogExporter.cpp -o log_analyzer